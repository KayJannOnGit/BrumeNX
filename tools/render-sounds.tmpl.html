<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Brume — enregistrer les sons</title>
<style>body{background:#0b0d14;color:#cfd6f2;font:15px/1.5 system-ui,sans-serif;padding:20px}pre{color:#9aa4cc}</style></head>
<body><h1>Enregistrement des sons de la maquette</h1><pre id="log">…</pre>
<script>
// Page générée par gen_render_page.py : les fonctions de son ci-dessous sont COPIÉES de la maquette, sans retouche.
// Chaque son est rejoué hors ligne (OfflineAudioContext) avec les mêmes bus que la maquette (audioStart),
// puis envoyé en WAV 16 bits stéréo au petit serveur local qui l'écrit dans brume/assets/sounds/.
let AC, master, revIn, sfxBus, wetBus, OFF=0;
function rumble(){}
function playCustom(){ return false; }        // tes sons perso : pas ici
let curChord={chord:[0,0,0,0],sub:0};                                    // la vibration n'est pas dans le son
/*@CONSTS@*/
/*@FUNCS@*/
const log=t=>{ document.getElementById('log').textContent+='\n'+t; };
// AC « décalé » : permet de lancer une partie d'un son un peu plus tard (ex. le son d'unlock 90 ms après le boum)
function wrap(ctx){ return new Proxy(ctx,{ get(t,p){ if(p==='currentTime') return t.currentTime+OFF; const v=Reflect.get(t,p,t); return typeof v==='function'?v.bind(t):v; } }); }
// les mêmes bus que audioStart() dans la maquette
function buses(ctx){ AC=wrap(ctx); OFF=0;
  master=AC.createGain(); master.gain.value=.85; const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3;
  master.connect(comp); comp.connect(AC.destination);
  const conv=AC.createConvolver(); conv.buffer=makeIR(8); revIn=AC.createGain(); const revOut=AC.createGain(); revOut.gain.value=.6;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(master);
  sfxBus=AC.createGain(); sfxBus.gain.value=1.1; sfxBus.connect(master); const s2=AC.createGain(); s2.gain.value=.8; sfxBus.connect(s2); s2.connect(revIn);
  wetBus=AC.createGain(); wetBus.gain.value=1.3; const wetDry=AC.createGain(); wetDry.gain.value=.18; wetBus.connect(wetDry); wetDry.connect(master); const wetSend=AC.createGain(); wetSend.gain.value=1.4; wetBus.connect(wetSend); wetSend.connect(revIn); }
function wav(chs,len,sr){ const C=chs.length, b=new ArrayBuffer(44+len*2*C), v=new DataView(b); const S=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  S(0,'RIFF'); v.setUint32(4,36+len*2*C,true); S(8,'WAVE'); S(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,C,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2*C,true); v.setUint16(32,2*C,true); v.setUint16(34,16,true); S(36,'data'); v.setUint32(40,len*2*C,true);
  let peak=0; for(let i=0;i<len;i++) for(let c=0;c<C;c++){ const x=Math.max(-1,Math.min(1,chs[c][i])); peak=Math.max(peak,Math.abs(x)); v.setInt16(44+(i*C+c)*2,Math.round(x*32767),true); }
  return {b,peak}; }
async function save(name,chs,len,sr){ const {b,peak}=wav(chs,len,sr); const r=await fetch('/save/'+name,{method:'POST',body:b});
  log(`${name} : ${(len/sr).toFixed(2)} s, ${sr} Hz, crête ${(20*Math.log10(peak||1e-9)).toFixed(1)} dB → ${r.ok?'OK':'ERREUR'}`); }
// un son ponctuel : on joue la recette, on garde jusqu'à ce que la réverbération soit retombée (−66 dB)
async function oneShot(name,sec,play,sr=24000,ch=2){ const ctx=new OfflineAudioContext(ch,sr*sec,sr); buses(ctx); play(); OFF=0;
  const buf=await ctx.startRendering(), chs=ch===2?[buf.getChannelData(0),buf.getChannelData(1)]:[buf.getChannelData(0)];
  let end=buf.length-1; while(end>0&&chs.every(c=>Math.abs(c[end])<5e-4)) end--;
  const len=Math.min(buf.length,end+Math.round(sr*.05)), fade=Math.round(sr*.03);
  for(let i=0;i<fade;i++){ const k=i/fade; chs.forEach(c=>c[len-1-i]*=k); }
  await save(name,chs,len,sr); }
// la nappe en boucle : même graphe que audioStart(), palier fixé ; 8 s d'amorce (réverb pleine), 24 s de boucle,
// la fin (4 s) fondue dans le début pour que la boucle soit invisible
async function padLoop(name,ch,stage,filt){ const sr=8000, PRE=8, L=16, X=4, ctx=new OfflineAudioContext(2,sr*(PRE+L+X),sr); buses(ctx);
  const ambBus=AC.createGain(); ambBus.gain.value=1; ambBus.connect(master); const send=AC.createGain(); send.gain.value=.85; ambBus.connect(send); send.connect(revIn);
  const ambFilter=AC.createBiquadFilter(); ambFilter.type='lowpass'; ambFilter.frequency.value=filt; ambFilter.Q.value=.6;
  const padGain=AC.createGain(); padGain.gain.value=1; ambFilter.connect(padGain); padGain.connect(ambBus); const v=STAGE_VOICES[stage];
  for(let i=0;i<4;i++){ const g=AC.createGain(); g.gain.value=.045; const st=AC.createGain(); st.gain.value=v[i+1]; g.connect(st); st.connect(ambFilter);
    [-8,8].forEach(dt=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.detune.value=dt; o.frequency.value=mtof(ch.chord[i]); o.connect(g); o.start(); });
    const s=AC.createOscillator(); s.type='sine'; s.frequency.value=mtof(ch.chord[i]); const sg=AC.createGain(); sg.gain.value=.7; s.connect(sg); sg.connect(g); s.start();
    const lfo=AC.createOscillator(); lfo.frequency.value=.05+i*.023; const lg=AC.createGain(); lg.gain.value=.02; lfo.connect(lg); lg.connect(g.gain); lfo.start(); }
  const sub=AC.createOscillator(); sub.type='sine'; sub.frequency.value=mtof(ch.sub); const subG=AC.createGain(); subG.gain.value=.17; sub.connect(subG);
  const subStage=AC.createGain(); subStage.gain.value=v[0]; subG.connect(subStage); subStage.connect(padGain); sub.start();
  const lfo=AC.createOscillator(); lfo.frequency.value=.04; const lg=AC.createGain(); lg.gain.value=200; lfo.connect(lg); lg.connect(ambFilter.frequency); lfo.start();
  const buf=await ctx.startRendering(), n=L*sr, x=X*sr, o=PRE*sr, out=[new Float32Array(n),new Float32Array(n)];
  for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++) out[c][i]=d[o+i];
    for(let i=0;i<x;i++){ const w=i/x*Math.PI/2; out[c][i]=d[o+i]*Math.sin(w)+d[o+n+i]*Math.cos(w); } }
  await save(name,out,n,sr); }
(async()=>{ try{
  const ch=LOCK_CHORD.chord;
  // sortie de veille (wakeUp)
  await oneShot('wake',12,()=>{ softLow(LOCK_CHORD.sub+12,.06,1.8); bell(LOCK_CHORD.chord[0]+24,.018,4,.35,wetBus); });
  // appuis 1 et 2 (pressChord(0) / pressChord(1))
  // v29.2 (Yass: hear the 3 steps, richer and richer): press 1 = one note; press 2 = two notes and the octave above
  for(const i of [0,1]) await oneShot('press'+(i+1),14,()=>{ heartbeat(.5+.1*i); bell(ch[i]+12,.095,5.5,.06,wetBus); if(i===1){ bell(ch[0]+12,.05,5.5,.12,wetBus); bell(ch[0]+24,.03,5,.22,wetBus); } rippleAir(i); });
  // 3e appui : le « big bang » (remarque de Yass : plus d'éclats) = la 3e note de l'accord + le boum de l'onde de choc
  // le plus fort (shockSound(2)) + le son d'unlock 90 ms plus tard (l'accord mineur se résout en majeur)
  await oneShot('bigbang',13,()=>{ bell(ch[2]+12,.07,4.5,.06,wetBus); OFF=.09; unlockBloom(); });   // v29 : le boum rond, la harpe pentatonique, le chœur (plus de cascade ni de 7e)
  // la lumière se retire (goSleep → sighSound)
  await oneShot('sigh',12,()=>{ sighSound(); });
  // la note d'un cube touché par la lumière (chime(m,pan,.035,2)) : les 3 notes des 3 cubes, au centre (le panoramique se fait sur la console)
  for(const m of [70,81,86]) await oneShot('chime'+m,8,()=>{ chime(m,0,.035,2); });   // v28 : notes du Si♭ maj7 (ch[0], ch[2], ch[3] + 24)
  // la nappe : palier 1 et 2 de l'écran verrouillé (filtre 300 + 330 × appuis), puis la Switch en entier (filtre 720)
  await padLoop('pad_lock1',LOCK_CHORD,1,380);   // v29.2: step 1 darker (the bass and one low voice, closed filter)
  await padLoop('pad_lock2',LOCK_CHORD,2,1500);  // v29.2: step 2 clearly brighter (three voices, open filter)
  // la nappe de chaque console (setChord(CONSOLES[i]) + toutes les voix, filtre 720 sur la roue)
  for(let i=0;i<CONSOLES.length;i++) await padLoop('pad_c'+i,CONSOLES[i],3,720);
  // ---- le kit de la roue : des notes de référence que la console rejoue à la bonne hauteur ----
  const K=16000;   // le kit : mono 16 kHz (rien au-dessus de 8 kHz ; la console place chaque son à gauche/droite)
  // v29 — toucher un cube (cristal ; la console le rejoue plus ou moins vite selon la taille) et changer de page (gauche / droite)
  await oneShot('crystal',5,()=>crystalTouch(0,.05,84),24000,1);   // v29.2: a real note (C6), the console sings it on the chord
  await oneShot('page_r',4,()=>pageSweep(1)); await oneShot('page_l',4,()=>pageSweep(-1));
  // v28 — la transition angélique : le chœur aérien de chaque console (angelSwell), joué quand on arrive sur elle
  for(let i=0;i<CONSOLES.length;i++) await oneShot('swell'+i,9,()=>angelSwell(CONSOLES[i]),K,1);
  // cloches (bell) : vers la réverb (wetBus) et vers les sons d'interface (sfxBus), à 2 hauteurs de référence
  for(const m of [60,74]){ await oneShot('bellw'+m,10,()=>bell(m,.045,3,0,wetBus),K,1); await oneShot('bells'+m,10,()=>bell(m,.045,3.3,0,sfxBus),K,1); }
  // l'arrivée d'une console (popNote) : normale et « console choisie », 2 hauteurs de référence
  for(const m of [70,84]) for(const hero of [false,true]){ curChord={chord:[m-24,0,0,0],sub:0}; await oneShot((hero?'plinkh':'plink')+m,10,()=>popNote(0,0,hero),K,1); }
  // se déplacer (navSound) : une note entre 72 et 79, au centre (la console la place à gauche/droite)
  { const st=selectTick; selectTick=()=>{}; await oneShot('nav76',4,()=>navSound(0,{chord:[0,0,0,64],sub:0}),K,1); selectTick=st; }
  // le « tok » de déplacement (selectTick) : remplaçable par sdmc:/brume/perso/deplacement.wav
  await oneShot('deplacement',2,()=>selectTick(0),K,1);
  // le souffle qui traverse la scène quand on tourne (il part du côté où l'on tourne)
  await oneShot('whoosh',8,()=>whoosh(0),K,1);   // le balayage gauche/droite est refait sur la console
  // une console qui se pose (thock), un « tic » de verre (appuyer), les notes graves douces, les souffles
  await oneShot('thock',4,()=>thock(0,1,.22),K,1);
  await oneShot('tick2400',3,()=>glassTick(0,.1,2400),K,1); await oneShot('tick1700',3,()=>glassTick(0,.08,1700),K,1);
  for(const [n,d] of [['low06',.6],['low09',.9],['low11',1.1],['low18',CAM_DUR]]) await oneShot(n,6,()=>softLow(50,.1,d),K,1);
  await oneShot('swishcam',8,()=>swish(0,0,CAM_DUR,.045),K,1);
  // plonger dans une console (A) : le souffle de openConsole()
  await oneShot('dive',8,()=>{ const n=noiseNode(1), f=AC.createBiquadFilter(), g=AC.createGain(); f.type='lowpass'; f.frequency.setValueAtTime(200,AC.currentTime); f.frequency.exponentialRampToValueAtTime(1400,AC.currentTime+.9);
    g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.1,AC.currentTime+.5); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1); n.connect(f); f.connect(g); g.connect(wetBus); n.start(); },K,1);
  log('TERMINÉ'); window.renderDone=true;
}catch(e){ log('ERREUR '+e); window.renderDone='err'; } })();
</script></body></html>
