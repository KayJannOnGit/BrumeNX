// atlas : même rangement aux 2 échelles
function pack(scale){ let x=0,y=0,rowH=0; const W=scale>1?2048:1536, out=[];

// v73 — l'ÉPAISSEUR des icônes des réglages : la distance signée au bord, dans le bleu (vide jusqu'ici), pour le verre

// transformée de distance exacte dedans et dehors (Felzenszwalb et Huttenlocher, écrite par nous), moyennée par pixel.
function sdfIcons(atlases){ const INF=1e20;
  const edt1=(f,n)=>{ const d=new Float64Array(n), v=new Int32Array(n), z=new Float64Array(n+1); let k=0; v[0]=0; z[0]=-INF; z[1]=INF;

        if(s<=z[k]&&k>0){ k--; continue; } if(s<=z[k]){ v[0]=q; z[0]=-INF; z[1]=INF; break; } k++; v[k]=q; z[k]=s; z[k+1]=INF; break; } }
    k=0; for(let q=0;q<n;q++){ while(z[k+1]<q) k++; const p=v[k]; d[q]=(q-p)*(q-p)+f[p]; } return d; };

      const dO=any?edt(ins,W4,H4):null, dI=any?edt(out,W4,H4):null;
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let sum=0;
        for(let j=0;j<U;j++) for(let i=0;i<U;i++){ const k=(y*U+j)*W4+x*U+i; sum+=any?(ins[k]?-(dI[k]-.5):dO[k]-.5):8*scale*U; }
        const d=sum/(U*U)/U/scale; a.px[((y0+y)*a.W+x0+x)*4+2]=Math.max(0,Math.min(255,Math.round((.5-d/16)*255))); } }); }); }

    const ax=[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]]; let lo=P[0], hi=P[0], plo=1e9, phi=-1e9;
    for(const c of P){ const d=c[0]*ax[0]+c[1]*ax[1]+c[2]*ax[2]; if(d<plo){ plo=d; lo=c; } if(d>phi){ phi=d; hi=c; } }
    let c0=q(...hi), c1=q(...lo); if(c0<c1){ const t=c0; c0=c1; c1=t; }
    let idx=0;
    if(c0!==c1){ const e0=dq(c0), e1=dq(c1), pal=[e0,e1,e0.map((a,k)=>(2*a+e1[k])/3),e0.map((a,k)=>(a+2*e1[k])/3)];
